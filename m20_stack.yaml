# Laptop-side settings for the M20 Open-RMF stack, read at launch so nothing needs
# exporting by hand:
#   - launch/laptop_bridge.launch.py   (Foxy devcontainer)
#   - m20_rmf.launch.py and the `m20` CLI (Jazzy devcontainer)
# Command-line arguments still override these (e.g. robots:=741,834, --site ...).
# Paths are relative to this file.

robots: ["834"]            # active robots (ids as in the site file)

robots_domain: 0           # where the robots' relays publish /*_relayed_<id>
rmf_domain: 20             # Open-RMF + our tools (the Jazzy devcontainer is preset to 20)

# DDS profile for the Foxy bridge's participants (the laptop profile: whitelist the
# laptop's Wi-Fi address in it).
laptop_profile: fastdds_profile.xml

# Site file for Open-RMF: places, lanes, routes, formations, zones, targets, robots.
site: rmf/m20_rmf/sites/lab_834_corridor.yaml

# Optional bridge extras
bridge_clouds: false       # also bridge /ALIGNED_POINTS_relayed_<id> (heavy)

# Robot side, used by scripts/m20_stack.sh to start each robot's relay over SSH (robot
# IPs come from the site file). The robots' image and files are not modified.
robot_relay: odom          # odom = odometry + SLAM map relays (all RMF/RViz need; light on Wi-Fi)
                           # full = the image's relays.launch.py; none = start it yourself
ssh_user: user
ssh_key: ""                          # empty: the key from ~/.ssh/config (Host 192.168.123.*)
robot_container: user-nav_cmd_bridge-1
robot_profile: /root/m20_relay_profile.xml # our relay DDS profile inside that container:
                                      # robot/fastdds_relay.xml with the robot's IP, copied
                                      # in on every relay start (the team's own
                                      # ~/fastdds_relay.xml on the robot is not used)
robot_compose_dir: "~"                # where the robot's docker-compose.yml is (recreates
robot_compose_service: nav_cmd_bridge # the container if it is gone after a power-off)
