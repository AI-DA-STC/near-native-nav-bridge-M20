# Real-robot pipeline test for one dog on sites/lab_834_test.yaml. Mirrors the shape
# of visitor_demo.yaml (patrol -> form up -> explore -> inspect -> form up -> patrol)
# inside a 2 m corridor.
name: test_834_corridor
steps:
  - phase: "Patrolling the corridor"
  - patrol: {robots: ["834"], rounds: 1, wait: true}
  - phase: "Forming up"
  - form_up: {formation: line}
  - phase: "Exploring the probe zone"
  - explore: {zone: corridor_probe}
  - phase: "Inspecting the test box"
  - inspect: {target: box_right, robot: "834"}
  - phase: "Regrouping, then home"
  - form_up: {formation: line}
  - return_home: {}
