# The visitor demo: patrol -> regroup -> explore the new area -> investigate a suspicious
# item -> regroup -> resume patrols. Operator moments are GUI buttons (or
# `m20 trigger <event>`); `phase` lines are what the GUI shows big.
#
#   GUI: pick "visitor_demo", Start       CLI: m20 mission /repo/rmf/m20_rmf/missions/visitor_demo.yaml
#   (add --robots 834 on the CLI to rehearse with one dog; robots not active are substituted)
name: visitor_demo
description: Patrol, regroup, explore, investigate a suspicious item, regroup, patrol.

# Buttons the GUI offers for the whole mission. Pressing one early is fine: the mission
# uses it when it gets there. `data` travels with the signal (see ${suspicious.target}).
signals:
  - {event: suspicious, label: "Suspicious item at box 1", data: {target: box1}}

steps:
  - phase: "Patrolling"
  - patrol: {}                                  # every robot on its own route, background
  - wait_trigger: {event: start, label: "Begin scenario", prompt: "Robots on patrol. Begin the scenario?"}

  - phase: "Regrouping"
  - form_up: {formation: muster}                # cancels patrols; waits until all are in place
  - hold: {seconds: 2}

  - phase: "Exploring the new area"
  - explore: {zone: new_area}                   # one track per robot, back to the gate

  - phase: "Awaiting report"
  - wait_trigger: {event: suspicious, label: "Suspicious item at box 1", prompt: "Area explored. Anything suspicious?"}

  - phase: "Investigating suspicious item"
  - parallel:
      - inspect: {target: "${suspicious.target}", robot: "834"}   # verdict from the GUI or the vision model
      - hold: {robots: ["741", "665"], seconds: 20}              # the others stand by

  - phase: "Regrouping"
  - form_up: {formation: muster}

  - phase: "Resuming patrols"
  - patrol: {}
